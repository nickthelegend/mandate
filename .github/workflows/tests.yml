# Every test, on every push.
#
# Every suite runs as its own step rather than one command, because they have
# genuinely different failure modes -- a red job should say which layer broke
# without anyone opening the log.
#
# Nothing here needs a credential or a network. The contract tests run against
# an in-process Hardhat chain, and every package suite is offline by
# construction: the rule engine is a pure function of an intent and a snapshot,
# and the MCP layer substitutes the network at the client boundary. The live Sepolia flows are exercised by
# hand and their transaction hashes are in the README.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # contracts/ is deliberately outside the workspace -- Hardhat pins its own
      # ethers and toolchain, and hoisting those into the SDK's tree caused
      # version conflicts. The cost is that it needs its own install, and
      # without one `npx hardhat` fetches a non-local copy and refuses to run.
      - name: Install contract toolchain
        run: npm ci
        working-directory: contracts

      # The MCP stdio suite spawns the built binary, and the web app imports the
      # SDK by name, so the workspace has to be built before anything is tested.
      - name: Build packages
        run: npm run build

      - name: Contracts
        run: npm run test:contracts

      # The rule engine, the bureau's bounded score, the escalation state
      # machine and the receipt tree. These are where a wrong answer is
      # silent -- a policy that approves what it should refuse looks exactly
      # like one that works -- and for two months they were not in CI at all.
      - name: Policy engine
        run: npm run test -w mandate-policy

      - name: Bureau
        run: npm run test -w mandate-bureau

      - name: Escalation
        run: npm run test -w mandate-escalation

      - name: Receipts
        run: npm run test -w mandate-receipts

      - name: SDK
        run: npm run test -w mandate-sdk

      - name: MCP
        run: npm run test -w mandate-mcp

      # The published entry points claim to be browser-safe. This is the check
      # that keeps that true.
      - name: Entry point boundaries
        run: node scripts/check-entrypoints.mjs
        working-directory: packages/sdk

      - name: Typecheck
        run: npm run typecheck
