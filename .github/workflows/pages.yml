# Build the console and publish it to GitHub Pages.
#
# The site is a static export that reads Sepolia from the visitor's browser, so
# there is nothing to run server-side and nothing for a deploy to get wrong
# beyond copying files.
#
# basePath is set here rather than committed to next.config.mjs: the app is
# served from /mandate/ on github.io but from / anywhere else, and hard-coding
# the repo name would break every other way of running it.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The web app imports both workspace packages by name, so their builds
      # have to run before Next can resolve them. Policy first: the SDK does not
      # depend on it, but the console imports it directly for the client-side
      # decision demo, and an unbuilt workspace package fails resolution rather
      # than falling back to source.
      - run: npm run build -w mandate-policy
      - run: npm run build -w mandate-sdk

      - run: npm run build -w mandate-web
        env:
          NEXT_PUBLIC_BASE_PATH: /mandate

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
